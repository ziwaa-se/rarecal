[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rarecal"
version = "0.1.0"
description = "Audit and repair how often a generative model produces rare events"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Zihua She", email = "she8@purdue.edu" },
  { name = "Xiao Wang", email = "wangxiao@purdue.edu" },
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]
keywords = ["generative models", "evaluation", "extreme value theory", "calibration", "FID", "diffusion"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.5", "pandas>=1.4"]
dev = ["pytest>=7", "matplotlib>=3.5", "pandas>=1.4"]

[project.scripts]
rarecal = "rarecal.cli:main"

[project.urls]
Homepage = "https://ziwaa-se.github.io/rarecal/"
Repository = "https://github.com/ziwaa-se/rarecal"

[tool.setuptools]
packages = ["rarecal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
